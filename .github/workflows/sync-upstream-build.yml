name: Sync upstream and build custom apps

on:
  push:
    branches:
      - main
    # Docs-only pushes need no new build; the sync job also skips them on schedule.
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      release_version: ${{ steps.sync.outputs.release_version }}
      upstream_release_tag: ${{ steps.sync.outputs.upstream_release_tag }}
      upstream_commit: ${{ steps.sync.outputs.upstream_commit }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream updates
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
          git fetch upstream main

          upstream_release_tag="$(gh api repos/bggRGjQaUbCoE/PiliPlus/releases/latest --jq .tag_name)"
          upstream_version="${upstream_release_tag#v}"
          before="$(git rev-parse HEAD)"
          # The fork keeps its own README (.gitattributes: merge=ours).
          git config merge.ours.driver true
          git merge --no-edit upstream/main
          after="$(git rev-parse HEAD)"
          upstream_commit="$(git rev-parse upstream/main)"

          release_version="${upstream_version}-fork.${GITHUB_RUN_NUMBER}"
          release_tag="v${release_version}"

          echo "commit_sha=$after" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_commit=$upstream_commit" >> "$GITHUB_OUTPUT"

          if [ "$before" != "$after" ]; then
            git push origin HEAD:main
          fi

          latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0] // {} | [.tag_name // "", .target_commitish // ""] | @tsv')"
          read -r existing_tag existing_commit <<< "$latest_release"
          # Skip when nothing but Markdown changed since the latest release of this upstream version.
          changed=""
          if [ -n "$existing_commit" ] && git cat-file -e "${existing_commit}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$existing_commit" "$after" | grep -v '\.md$' || true)"
          else
            changed="unknown"
          fi
          if [[ -z "$changed" && "$existing_tag" == "v${upstream_version}-fork."* ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Build Android APKs
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Restore signing key from secrets
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Building without them produces a random signature and every update conflicts with the installed app."
            exit 1
          fi
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build release APKs
        shell: bash
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-Android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Build unsigned IPA
        shell: bash
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json
          ln -sf ./build/ios/iphoneos Payload
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus-custom-ios-unsigned.ipa Payload/Runner.app

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-iOS-${{ github.run_number }}
          path: PiliPlus-custom-ios-unsigned.ipa
          if-no-files-found: error

  windows:
    name: Build Windows x64
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        shell: pwsh
        run: Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Build Windows installer
        run: fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Collect Windows packages
        shell: pwsh
        run: |
          # Windows paths ignore case: keep the portable folder apart from release/.
          New-Item -ItemType Directory -Force -Path release, portable/PiliPlus-Win | Out-Null
          Move-Item build/windows/x64/runner/Release/* portable/PiliPlus-Win/
          Compress-Archive -Path portable/PiliPlus-Win -DestinationPath release/PiliPlus-custom-windows-x64-portable.zip
          $setup = @(Get-ChildItem dist -Recurse -Filter *.exe)
          if ($setup.Count -ne 1) { throw "Expected one installer, found $($setup.Count)" }
          Move-Item $setup[0].FullName release/PiliPlus-custom-windows-x64-setup.exe

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-Windows-${{ github.run_number }}
          path: release/*
          if-no-files-found: error

  macos:
    name: Build macOS DMG
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Build macOS app
        shell: bash
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Package DMG
        shell: bash
        run: |
          npm install --global create-dmg
          # Unsigned: create-dmg still writes the image, then fails on code signing.
          create-dmg build/macos/Build/Products/Release/PiliPlus.app || true
          mkdir -p release
          mv PiliPlus*.dmg release/PiliPlus-custom-macos.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-macOS-${{ github.run_number }}
          path: release/PiliPlus-custom-macos.dmg
          if-no-files-found: error

  linux:
    name: Build Linux x64 packages
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev
        shell: bash

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

        #TODO: deb and rpm packages need to be build
      - name: Build Linux
        run: flutter build linux --release --dart-define-from-file=pili_release.json --no-pub

      - name: Package .tar.gz
        run: tar -zcvf PiliPlus_linux_${{ env.version }}_amd64.tar.gz -C build/linux/x64/release/bundle .

      - name: Packege deb
        run: |
          printf "建立构建目录...\n"
          mkdir "PiliPlus_linux_${{ env.version }}_amd64"
          pushd "PiliPlus_linux_${{ env.version }}_amd64"
          mkdir -p opt/PiliPlus
          mkdir -p usr/share/applications
          mkdir -p usr/share/icons/hicolor/512x512/apps

          printf "复制文件...\n"
          cp -r ../build/linux/x64/release/bundle/* opt/PiliPlus
          cp -r ../assets/linux/DEBIAN .
          cp ../assets/linux/com.example.piliplus.desktop usr/share/applications
          cp ../assets/images/logo/logo.png usr/share/icons/hicolor/512x512/apps/piliplus.png

          printf "修改控制文件...\n"
          # 替换版本号
          sed -i  "2s/version_need_change/${{ env.version }}/g" DEBIAN/control
          # 计算安装大小并替换
          SIZE_KB=$(du -s -b --apparent-size . | awk '{print int($1)}')
          SIZE_KB=$(($SIZE_KB - $(du -s -b --apparent-size DEBIAN | awk '{print int($1)}')))
          SIZE_KB=$(echo $SIZE_KB | awk '{print int($1/1024 + 0.999)}')
          printf "\t安装大小: %s KB\n" "$SIZE_KB"
          sed -i "9s/size_need_change/${SIZE_KB}/g" DEBIAN/control

          printf "生成并写入 md5sums ...\n"
          md5sum opt/PiliPlus/piliplus >> DEBIAN/md5sums
          md5sum opt/PiliPlus/lib/* >> DEBIAN/md5sums
          md5sum opt/PiliPlus/data/icudtl.dat >> DEBIAN/md5sums

          printf "设置权限...\n"
          chmod 0644 DEBIAN/control
          chmod 0644 DEBIAN/md5sums
          chmod 0755 DEBIAN/postinst
          chmod 0755 DEBIAN/postrm
          chmod 0755 DEBIAN/prerm

          printf "打包 deb 文件...\n"
          popd
          dpkg-deb --build --verbose --root-owner-group "PiliPlus_linux_${{ env.version }}_amd64"
          printf "完成: PiliPlus_linux_%s_amd64.deb\n" "${{ env.version }}"
        shell: bash

      - name: Packege rpm
        run: |
          printf "建立 RPM 构建目录...\n"
          RPM_BUILD_ROOT="$PWD/rpm_build"
          mkdir -p "$RPM_BUILD_ROOT/BUILD" "$RPM_BUILD_ROOT/RPMS" "$RPM_BUILD_ROOT/SOURCES" "$RPM_BUILD_ROOT/SPECS" "$RPM_BUILD_ROOT/SRPMS"

          printf "准备源码归档（仅包含运行时与元数据）...\n"
          DATE="$(date '+%a %b %d %Y')"
          SRC_DIR="$PWD/piliplus-${{ env.version }}"
          mkdir -p "$SRC_DIR/bundle" "$SRC_DIR/assets"
          cp -r build/linux/x64/release/bundle/* "$SRC_DIR/bundle/"
          cp assets/linux/com.example.piliplus.desktop "$SRC_DIR/assets/com.example.piliplus.desktop"
          cp assets/images/logo/logo.png "$SRC_DIR/assets/piliplus.png"
          tar -zcvf "$RPM_BUILD_ROOT/SOURCES/piliplus-${{ env.version }}.tar.gz" -C "$PWD" "piliplus-${{ env.version }}"

          printf "生成 spec 文件...\n"
          cat > "$RPM_BUILD_ROOT/SPECS/piliplus.spec" <<EOF
          Name:           piliplus
          Version:        ${{ env.version }}
          Release:        1%{?dist}
          Summary:        PiliPlus Linux Version
          License:        GPL-3.0
          Source0:        piliplus-${{ env.version }}.tar.gz
          Requires:       desktop-file-utils, hicolor-icon-theme

          %description
          使用 Flutter 开发的 BiliBili 第三方客户端

          %prep
          %setup -q -n piliplus-${{ env.version }}

          %build

          %install
          mkdir -p %{buildroot}/opt/PiliPlus
          cp -r bundle/* %{buildroot}/opt/PiliPlus/

          # 二进制权限与命令行入口
          chmod 755 %{buildroot}/opt/PiliPlus/piliplus
          mkdir -p %{buildroot}/usr/bin
          ln -sf /opt/PiliPlus/piliplus %{buildroot}/usr/bin/piliplus

          # 桌面集成
          mkdir -p %{buildroot}/usr/share/applications
          install -m 644 assets/com.example.piliplus.desktop %{buildroot}/usr/share/applications/com.example.piliplus.desktop

          mkdir -p %{buildroot}/usr/share/icons/hicolor/512x512/apps
          install -m 644 assets/piliplus.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/piliplus.png

          %post
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %postun
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %files
          /opt/PiliPlus
          /usr/bin/piliplus
          /usr/share/applications/com.example.piliplus.desktop
          /usr/share/icons/hicolor/512x512/apps/piliplus.png

          %changelog
          * DATE - ${{ env.version }}-1
          - Initial RPM release
          EOF

          sed -i "s/DATE/${DATE}/g" "$RPM_BUILD_ROOT/SPECS/piliplus.spec"

          printf "构建 RPM 包...\n"
          rpmbuild --define "_topdir $RPM_BUILD_ROOT" -bb "$RPM_BUILD_ROOT/SPECS/piliplus.spec"

          printf "移动生成的 RPM...\n"
          find "$RPM_BUILD_ROOT/RPMS" -name "*.rpm" -exec mv {} "PiliPlus_linux_${{ env.version }}_amd64.rpm" \;

          printf "完成: PiliPlus_linux_%s_amd64.rpm\n" "${{ env.version }}"
        shell: bash

      - name: Package AppImage
        run: |
          printf "下载 appimagetool...\n"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          printf "建立 AppDir 目录结构...\n"
          APPDIR="PiliPlus.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          printf "复制应用文件...\n"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"

          printf "复制桌面文件和图标...\n"
          cp assets/linux/com.example.piliplus.desktop "$APPDIR/com.example.piliplus.desktop"
          cp assets/linux/com.example.piliplus.desktop "$APPDIR/usr/share/applications/com.example.piliplus.desktop"
          cp assets/images/logo/logo.png "$APPDIR/piliplus.png"
          cp assets/images/logo/logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/piliplus.png"

          printf "创建 AppRun 启动脚本...\n"
          cat > "$APPDIR/AppRun" <<'APPRUN_EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/piliplus" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"

          printf "修改桌面文件中的 Exec 路径...\n"
          sed -i 's|Exec=piliplus|Exec=piliplus|g' "$APPDIR/com.example.piliplus.desktop"
          sed -i 's|Icon=piliplus|Icon=piliplus|g' "$APPDIR/com.example.piliplus.desktop"

          printf "打包 AppImage...\n"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "PiliPlus_linux_${{ env.version }}_amd64.AppImage"

          printf "完成: PiliPlus_linux_%s_amd64.AppImage\n" "${{ env.version }}"
        shell: bash

      - name: Collect Linux packages
        shell: bash
        run: |
          mkdir -p release
          mv PiliPlus_linux_*_amd64.tar.gz release/PiliPlus-custom-linux-amd64.tar.gz
          mv PiliPlus_linux_*_amd64.deb release/PiliPlus-custom-linux-amd64.deb
          mv PiliPlus_linux_*_amd64.rpm release/PiliPlus-custom-linux-amd64.rpm
          mv PiliPlus_linux_*_amd64.AppImage release/PiliPlus-custom-linux-amd64.AppImage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-Linux-${{ github.run_number }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish custom release
    needs: [sync, android, ios, windows, macos, linux]
    # A desktop build that fails is left out rather than holding back the mobile release.
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish fork release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.sync.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.sync.outputs.release_version }}
          UPSTREAM_RELEASE_TAG: ${{ needs.sync.outputs.upstream_release_tag }}
          UPSTREAM_COMMIT: ${{ needs.sync.outputs.upstream_commit }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          passed="Android APK, unsigned iOS IPA"
          missing=""
          for build in "Windows:$WINDOWS_RESULT" "macOS:$MACOS_RESULT" "Linux:$LINUX_RESULT"; do
            if [ "${build#*:}" = success ]; then
              passed="$passed, ${build%%:*}"
            else
              missing="${missing:+$missing, }${build%%:*}"
            fi
          done

          gh api "repos/bggRGjQaUbCoE/PiliPlus/releases/tags/$UPSTREAM_RELEASE_TAG" --jq '.body // ""' > "$RUNNER_TEMP/upstream-release-notes.md"
          {
            # The in-app update dialog shows this body as plain text, so the notice
            # comes first. Installs signed with the key retired after 2.1.6-fork.1248
            # cannot update in place and can only learn that from here.
            cat <<'NOTICE'
          【Android 签名变更】2.1.6-fork.1248 之后的版本换了新签名。装着 2.1.6-fork.1248 或更早版本的设备不能直接覆盖更新，安装时会提示「应用未安装」或「与现有软件包冲突」，需要先卸载旧版再装新版。卸载会清空 App 数据，请先迁移：

          1. 在旧版打开 设置 → 关于，点「导入/导出登录信息」→「导出文件至本地」，再点「导入/导出设置」→「导出文件至本地」，把两个 json 存到「下载」等手机目录。
          2. 卸载旧版，安装新版。
          3. 在新版打开 设置 → 关于，用同样两项的「从本地文件导入」导回登录信息和设置。

          登录信息文件里有账号凭据，导入后请删掉，别发给别人。换签名之后装的版本以后照常更新，不受影响。

          NOTICE
            echo "Personal PiliPlus fork build $RELEASE_VERSION, based on upstream release $UPSTREAM_RELEASE_TAG."
            echo
            echo "Upstream: https://github.com/bggRGjQaUbCoE/PiliPlus/commit/$UPSTREAM_COMMIT"
            echo "Upstream release: https://github.com/bggRGjQaUbCoE/PiliPlus/releases/tag/$UPSTREAM_RELEASE_TAG"
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
            echo
            echo "Upstream release notes ($UPSTREAM_RELEASE_TAG):"
            echo
            cat "$RUNNER_TEMP/upstream-release-notes.md"
            echo
            echo "Builds passed: $passed."
            if [ -n "$missing" ]; then
              echo "Not included, the build failed: $missing."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "PiliPlus $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
