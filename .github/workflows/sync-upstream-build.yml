name: Sync upstream and build custom apps

on:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream main
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      release_version: ${{ steps.sync.outputs.release_version }}
      upstream_release_tag: ${{ steps.sync.outputs.upstream_release_tag }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream updates
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/bggRGjQaUbCoE/PiliPlus.git
          git fetch upstream main

          upstream_release_tag="$(gh api repos/bggRGjQaUbCoE/PiliPlus/releases/latest --jq .tag_name)"
          before="$(git rev-parse HEAD)"
          git merge --no-edit upstream/main
          after="$(git rev-parse HEAD)"

          version_name="$(sed -nE 's/^version:[[:space:]]*([0-9.]+).*/\1/p' pubspec.yaml | head -n 1)"
          version_code="$(git rev-list --count HEAD)"
          release_version="${version_name}.lemontea+${version_code}"
          release_tag="lemontea-${upstream_release_tag}-${GITHUB_RUN_NUMBER}"

          echo "commit_sha=$after" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "upstream_release_tag=$upstream_release_tag" >> "$GITHUB_OUTPUT"

          if [ "$before" != "$after" ]; then
            git push origin HEAD:main
          fi

          existing_release="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' |
              grep -F -m 1 "lemontea-${upstream_release_tag}-" || true
          )"

          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$existing_release" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Build Android APKs
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Write Android signing key
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "::error::SIGN_KEYSTORE_BASE64 secret is missing. Building without it produces a random signature and every update conflicts with the installed app. Set the signing secrets (see piliplus-fork-keys/set-secrets.sh) and re-run."
            exit 1
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties

      - name: Build release APKs
        shell: bash
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-Android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout updated fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply project Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Build unsigned IPA
        shell: bash
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json
          ln -sf ./build/ios/iphoneos Payload
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
          zip -r9 PiliPlus-custom-ios-unsigned.ipa Payload/Runner.app

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-custom-iOS-${{ github.run_number }}
          path: PiliPlus-custom-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish custom release
    needs: [sync, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish fork release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.sync.outputs.commit_sha }}
          RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.sync.outputs.release_version }}
          UPSTREAM_RELEASE_TAG: ${{ needs.sync.outputs.upstream_release_tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "$RELEASE_VERSION" \
            --notes "Based on upstream release ${UPSTREAM_RELEASE_TAG}. Includes the pinned CDN auto-switch feature."
